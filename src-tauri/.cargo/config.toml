# Point the vendored `spectrum` crate's build script at the pinned protocol
# artifacts committed in this repository. `bun run update:protos` generates
# this build snapshot from the private data/wuwa-protos tooling submodule.
# See docs/DEVELOPMENT.md.
#
# `relative = true` resolves the value against the parent directory of this
# `.cargo` directory (i.e. `src-tauri/`), so `protocol` is
# `<repo>/src-tauri/protocol`.
[env]
SPECTRUM_PROTO_DIR = { value = "protocol", relative = true }

# Use Rust's bundled LLVM linker instead of MSVC's memory-heavy debug link.
# rustc locates rust-lld in its own toolchain; no separate LLVM install is needed.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Grant capture capability after linking, before launching the Linux desktop
# app. The runner passes unit tests and game-client commands through unchanged.
[target.'cfg(target_os = "linux")']
runner = ["../scripts/linux-dev-runner.sh"]
