[package]
name = "mornye-tools"
version = "0.3.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mornye_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [".", "crates/account", "crates/game-client", "crates/sync", "crates/overlay", "crates/connection"]
default-members = ["."]
exclude = ["crates/spectrum"]
resolver = "2"

[workspace.dependencies]
spectrum = { path = "crates/spectrum" }

# The passive KCP mirror needs wrapping arithmetic for remote timestamps.
# Application overflow checks remain enabled.
[profile.dev.package.kcp]
overflow-checks = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mornye-sync = { path = "crates/sync" }
mornye-overlay = { path = "crates/overlay" }
mornye-connection = { path = "crates/connection" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-mcp-bridge = "0.13"
tauri-plugin-opener = "2"
