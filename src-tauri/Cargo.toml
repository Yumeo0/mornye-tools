[package]
name = "mornye-tools"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mornye_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Spectrum's passive KCP mirror needs wrapping arithmetic for remote timestamps.
# Keep overflow checks enabled for application code and all other dependencies.
[profile.dev.package.kcp]
overflow-checks = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-mcp-bridge = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
image = "0.25"
xberg = { version = "1.3.10", features = ["ocr"] }
imageproc = "0.27"
tokio = { version = "1", features = ["rt", "macros"] }

# Packet capture / account extraction
spectrum = { path = "crates/spectrum" }
parking_lot = "0.13"
pcap-file = "2"
rsa = { version = "0.9.10", features = ["pem"] }
sha2 = "0.11"
# Save timestamps (`account.json`). Already in the tree via tauri's
# cookie/plist dependencies; used for RFC3339 formatting only.
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-opener = "2"
session-probe = { path = "../tools/session-probe" }
keyring = { version = "3.6.3", default-features = false }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Persistent desktop Secret Service, with pure-Rust DBus/crypto (no libdbus link).
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

# Windows Graphics Capture for the OCR path, plus the window
# enumeration/geometry helpers it needs.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-capture = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Raw-socket packet capture (SIO_RCVALL), matching the reference wuwa-protos app.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_UI_Shell",
] }
