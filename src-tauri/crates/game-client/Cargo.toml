[package]
name = "mornye-game-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wuthering Waves authentication, discovery and active game sessions"

[build-dependencies]
serde_json = "1"

[dependencies]
aes = "0.8.4"
anyhow = "1"
base64 = "0.22"
cipher = { version = "0.4.4", features = ["alloc", "block-padding"] }
cbc = "0.1"
crc32fast = "1"
kcp = "0.6.0"
miniz_oxide = "0.8"
prost = "0.13"
prost-reflect = { version = "0.15.3", features = ["serde"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
